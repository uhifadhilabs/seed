doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # THE STOCK BLOCK, AND IT IS RIGHT. doctrine-bundle's Flex recipe
            # writes this assuming the symfony/skeleton's `App\` root, and the
            # skeleton's root IS `App\` (composer.json autoload.psr-4) — the
            # skeleton is
            # a stock Symfony application, and `Uhifadhi\` is reserved for the
            # platform's own packages (`Uhifadhi\Seam\`, and its siblings).
            #
            # It reads as boilerplate and is kept in the skeleton on purpose:
            # the skeleton is copied once and never updated, so a line here is
            # one every
            # future installation is stuck with, and this one has to be present
            # and correct before the area entity the seam asks for can map at
            # all. See config/packages/seam.yaml for that step.
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
