doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # `Uhifadhi\Entity`, NOT the stock recipe's `App\Entity`.
            #
            # doctrine-bundle's Flex recipe writes this block assuming the
            # symfony/skeleton's `App\` root. This project's root is `Uhifadhi\`
            # (composer.json autoload.psr-4), so the recipe's prefix points at a
            # namespace nothing here is in — and the failure arrives late and
            # unhelpfully, at the first class that needs mapping:
            #
            #   The class 'Uhifadhi\Entity\AreaOfInterest' was not found in the
            #   chain configured namespaces App\Entity, UhifadhiLabs\Trunk\Entity
            #
            # The seed is copied once and never updated, so a wrong line here is
            # one every future installation is stuck with, and it is corrected
            # before planting rather than in each planted project.
            Uhifadhi:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'Uhifadhi\Entity'
                alias: Uhifadhi

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
