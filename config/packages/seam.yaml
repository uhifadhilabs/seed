# The seam (uhifadhi/seam-module) — the module seam runtime every uhifadhi
# module registers with: the catalogue of what this deployment has, the record
# of what each area switched on, the permissions modules declare, and the seed
# that keeps them in step.
#
# ZERO MODULES IS A WORKING INSTALLATION. Nothing below is required — both keys
# have defaults and the tree is closed, so an unknown key fails loudly rather
# than being ignored. A fresh installation with this bundle and nothing else
# boots, has an empty catalogue, and is harmless:
#
#   bin/console seam:catalogue:seed
#   → Catalogue reconciled: 0 module(s) from 0 installed provider(s).
#
# ZERO MODULES IS NOT ZERO TABLES, though: the seam owns `module` and
# `area_module`, so an installation still has a schema to create — and
# `area_module` points at an AREA, which the seam does not define. The note at
# the bottom of this file says where the area comes from. Read it before you
# reach for `doctrine:migrations:diff`.
#
# THERE IS DELIBERATELY NO KEY LISTING MODULES. Installing a bundle IS the
# declaration — a module is in the catalogue because its provider carries the
# uhifadhi.module tag — and a second place to enable one is a second place for
# the two to disagree.
seam:
    # Where a module the catalogue cannot place is filed. A provider hands its
    # category over as a string and the seam coerces it, so a module bundle
    # written by somebody else can never break the catalogue with a typo.
    default_category: operations

# Dev-only tooling hangs off this flag, so a production installation never
# grows a command that writes invented catalogue rows.
when@dev:
    seam:
        dev_tools: true

when@test:
    seam:
        dev_tools: true

# WHERE THE AREA COMES FROM — and there is nothing here for you to uncomment.
#
# The seam owns the record of which modules an AREA has switched on. An area is
# not the seam's to define: the seam holds that table for installations whose
# area model is their own, so it maps the association to an interface it
# publishes, Uhifadhi\Seam\Entity\AreaInterface, and something has to say what
# that interface means.
#
# WHOEVER KNOWS THE ANSWER STATES THE RESOLUTION. Install uhifadhi/area-module
# and it states this one, the same way uhifadhi/team-module states the answer to
# the user contract — the package that provides the entity is the package that
# names it, and your installation writes nothing:
#
#   composer require uhifadhi/area-module
#
# Or bring your own class implementing Uhifadhi\Seam\Entity\AreaInterface (it
# asks for getId() and nothing else) and name it in YOUR OWN config, which
# overrules any module's answer because prepended configuration loses to the
# application's:
#
#   # config/packages/doctrine.yaml — yours, merged into the doctrine: block
#   # that is already there, under the existing orm:, beside mappings.
#   doctrine:
#       orm:
#           resolve_target_entities:
#               Uhifadhi\Seam\Entity\AreaInterface: App\Entity\ManagementUnit
#
# You write that line only to DISAGREE. Install the module and there is no
# doctrine edit at all.
#
# UNTIL ONE OR THE OTHER IS TRUE THERE IS NO SCHEMA. The bundle installs, the
# container compiles, the kernel boots, and `seam:catalogue:seed` runs. What you
# CANNOT do is touch the schema: the per-area ledger has a NOT NULL foreign key
# to an area, so anything that walks the metadata — `doctrine:schema:create`,
# `doctrine:schema:update`, `doctrine:migrations:diff` — stops on the unresolved
# interface:
#
#   In MappingException.php line 72:
#     Class 'Uhifadhi\Seam\Entity\AreaInterface' does not exist
#
# That is not a bug to route around. There is no half of this schema that exists
# without an area.
#
# MIND THE MAPPING PREFIX if you brought your own class — it has to be in the
# metadata chain. The stock doctrine-bundle recipe writes an `App\Entity` prefix
# into config/packages/doctrine.yaml, so an entity in src/Entity/ is already
# mapped. If you moved your entities elsewhere, the resolve_target_entities line
# still resolves but the class it names is not in the chain, and you get
#
#   The class 'App\Entity\ManagementUnit' was not found in the chain
#   configured namespaces App\Entity, Uhifadhi\Seam\Entity
#
# uhifadhi/area-module maps its own entity directory, so this cannot happen to
# an installation that took the module.
#
# THEN, in this order:
#
#   bin/console doctrine:database:create
#   bin/console doctrine:migrations:diff      # your history, your migration
#   bin/console doctrine:migrations:migrate
#   bin/console seam:catalogue:seed
#
# The seam ships entities, not migrations: the tables are the seam's, but the
# migration history is yours, and a vendor replaying its own versions into it
# would fight every `diff` you ever run. `doctrine/doctrine-migrations-bundle`
# arrives as a dependency of this bundle for exactly that reason — the bundle
# that adds tables brings the tool that creates them.
#
# After the seed, every area is backfilled with the modules it has no row for —
# including areas created between two deploys. The seed is create-only: it will
# never overrule an on/off or an ordering an admin has since chosen.
