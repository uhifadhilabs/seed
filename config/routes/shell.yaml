# The welcome page (uhifadhi/shell-module) — the one screen a fresh
# installation has before it has grown one of its own.
#
# WHY THIS FILE EXISTS AT ALL. The shell ships no routes and no controllers: it
# owns pages, never URLs, and a test in the bundle fails its build the day that
# changes. So an installation of the seam and the shell had nothing answering
# `/` and served Symfony's welcome-404 — a correct installation looking like a
# broken one, on its first minute. The bundle ships the page; this file, which
# belongs to YOUR application, is what puts it at an address.
#
# THERE IS NO CONTROLLER CLASS TO WRITE. TemplateController is Symfony's own,
# for exactly this: a URL whose entire job is to render one template.
#
# THIS IS YOURS TO REPLACE, and it is meant to be replaced. The day this
# installation has a real home screen, point `/` at it — or delete this file and
# let whichever module owns the front door claim the address. Nothing in the
# shell depends on the route name or on the route existing.
welcome:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: '@UhifadhiShell/welcome.html.twig'
